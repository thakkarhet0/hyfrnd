<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>god's plan — all palettes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Space Mono',monospace; background:#0a0a0a; color:#fff; padding:48px 24px; }

  .page-title { text-align:center; font-size:12px; font-weight:700; letter-spacing:0.14em; color:#444; margin-bottom:6px; }
  .page-subtitle { text-align:center; font-size:11px; color:#2e2e2e; letter-spacing:0.04em; margin-bottom:64px; }

  .group-label {
    font-size:10px; font-weight:700; letter-spacing:0.18em; color:#2a2a2a;
    padding-bottom:12px; border-bottom:1px solid #181818; margin-bottom:48px;
  }

  .palette-section { margin-bottom:72px; }

  .palette-header { display:flex; align-items:center; gap:18px; margin-bottom:26px; }
  .swatches { display:flex; gap:5px; }
  .swatch { width:20px; height:20px; border-radius:50%; border:1px solid rgba(255,255,255,0.05); flex-shrink:0; }
  .palette-meta { display:flex; flex-direction:column; gap:3px; }
  .palette-num { font-size:10px; font-weight:700; letter-spacing:0.14em; color:#2e2e2e; }
  .palette-name { font-size:18px; font-weight:700; color:#bbb; letter-spacing:-0.01em; }
  .palette-desc { font-size:11px; color:#3e3e3e; letter-spacing:0.02em; line-height:1.65; max-width:440px; margin-top:2px; }
  .mode-pill { font-size:9px; font-weight:700; letter-spacing:0.1em; padding:2px 7px; border-radius:20px; display:inline-block; margin-top:3px; }
  .light-pill { background:rgba(255,255,255,0.06); color:#666; }
  .dark-pill  { background:rgba(255,255,255,0.03); color:#444; }

  .screens-row { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  .screen-wrap { display:flex; flex-direction:column; gap:9px; align-items:center; }
  .screen-label { font-size:9px; color:#282828; letter-spacing:0.1em; }

  .phone { width:200px; height:400px; border-radius:6px; overflow:hidden; position:relative; flex-shrink:0; }
  .phone-inner { width:100%; height:100%; display:flex; flex-direction:column; padding:24px 18px 20px; position:relative; }

  .status-bar { display:flex; justify-content:space-between; font-size:9px; letter-spacing:0.05em; margin-bottom:5px; opacity:0.28; }
  .s-title { font-size:10px; font-weight:700; letter-spacing:0.11em; opacity:0.28; margin-bottom:3px; }

  .prompt { font-size:15px; font-weight:700; letter-spacing:-0.01em; line-height:1.35; margin-top:12px; margin-bottom:auto; }
  .record-area { display:flex; flex-direction:column; align-items:center; gap:11px; margin-bottom:13px; }
  .record-btn { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .record-hint { font-size:10px; letter-spacing:0.08em; opacity:0.32; }
  .sub-action { font-size:10px; letter-spacing:0.04em; opacity:0.2; }

  .ex-header { font-size:10px; font-weight:700; letter-spacing:0.1em; opacity:0.36; margin-top:9px; margin-bottom:9px; }
  .ex-card { border-radius:0px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .f-name { font-size:14px; font-weight:700; letter-spacing:-0.01em; }
  .c-dot { font-size:10px; opacity:0.6; letter-spacing:0.02em; padding-left:10px; position:relative; }
  .c-dot::before { content:'—'; position:absolute; left:0; opacity:0.38; }
  .f-fu { font-size:10px; font-weight:700; letter-spacing:0.06em; }
  .confirm-btn { border-radius:0px; padding:10px 0; text-align:center; font-size:10px; font-weight:700; letter-spacing:0.1em; margin-top:auto; font-family:'Space Mono',monospace; border:none; cursor:default; width:100%; }

  .h-header { font-size:10px; font-weight:700; letter-spacing:0.1em; opacity:0.28; margin-top:9px; margin-bottom:11px; }
  .c-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; }
  .c-name { font-size:12px; font-weight:700; letter-spacing:0.01em; }
  .c-meta { font-size:9px; opacity:0.33; letter-spacing:0.03em; margin-top:2px; }
  .c-badge { font-size:9px; font-weight:700; letter-spacing:0.08em; padding:2px 6px; border-radius:0px; }
  .fab { position:absolute; bottom:20px; right:16px; width:40px; height:40px; border-radius:4px; display:flex; align-items:center; justify-content:center; }

  .waveform { display:flex; gap:3px; align-items:center; height:16px; }
  .w-bar { width:3px; border-radius:0px; animation:wave 1s ease-in-out infinite; }
  .w-bar:nth-child(1){animation-delay:0s} .w-bar:nth-child(2){animation-delay:.1s}
  .w-bar:nth-child(3){animation-delay:.2s} .w-bar:nth-child(4){animation-delay:.3s}
  .w-bar:nth-child(5){animation-delay:.4s} .w-bar:nth-child(6){animation-delay:.2s}
  .w-bar:nth-child(7){animation-delay:.1s}
  @keyframes wave { 0%,100%{height:3px} 50%{height:13px} }

  .divider { width:100%; height:1px; background:#141414; margin:52px 0; }
</style>
</head>
<body>

<div class="page-title">god's plan</div>
<div class="page-subtitle">all palettes · direction 1 · space mono · all lowercase</div>

<div id="root"></div>

<script>
// ─── PALETTE DATA ───────────────────────────────────────────────────────────
// To add a new palette: append an object (light) and its dark counterpart.
// Each object: { id, name, desc, mode, swatches[], bg, surface, text, cta, ctaText, accent, wave1, wave2 }
// wave1 = outer waveform bars, wave2 = inner (louder) bars

const palettes = [
  // ── LIGHT ──────────────────────────────────────────────────────────────────
  {
    id: 1, name: 'sage + purple', mode: 'light',
    desc: 'botanical and grounded. the sage tones feel natural and unhurried. the purple cta carries weight without shouting.',
    swatches: ['#BAD8B6','#E1EACD','#F9F6E6','#8D77AB'],
    bg: '#F9F6E6', surface: '#E1EACD',
    text: '#2E2240', cta: '#8D77AB', ctaText: '#F9F6E6',
    accent: '#8D77AB', wave1: '#BAD8B6', wave2: '#8D77AB',
    divider: 'rgba(141,119,171,0.1)',
  },
  {
    id: 2, name: 'mint + rose', mode: 'light',
    desc: 'the softest of the set. rose feels the most personal — closest to the emotional goal of a relationship app.',
    swatches: ['#C0E1D2','#E5EEE4','#F6F4E8','#DC9B9B'],
    bg: '#F6F4E8', surface: '#E5EEE4',
    text: '#2A3028', cta: '#DC9B9B', ctaText: '#fff',
    accent: '#DC9B9B', wave1: '#C0E1D2', wave2: '#DC9B9B',
    divider: 'rgba(220,155,155,0.1)',
  },
  {
    id: 3, name: 'yellow + coral', mode: 'light',
    desc: 'the most alive of the light modes. warm yellow ground, coral cta, teal waveform. energy without loudness.',
    swatches: ['#FFF6DE','#FFE394','#8BDFDD','#F48F68'],
    bg: '#FFF6DE', surface: '#FFE394',
    text: '#2C1A0E', cta: '#F48F68', ctaText: '#FFF6DE',
    accent: '#F48F68', wave1: '#8BDFDD', wave2: '#F48F68',
    divider: 'rgba(244,143,104,0.13)',
  },
  {
    id: 4, name: 'original', mode: 'light',
    desc: 'cream background, indigo type. the record button is a quiet circle that doesn\'t announce itself.',
    swatches: ['#EFE3CA','#FAF6EE','#170C79','#8ACBD0'],
    bg: '#EFE3CA', surface: '#FAF6EE',
    text: '#170C79', cta: '#170C79', ctaText: '#EFE3CA',
    accent: '#56B6C6', wave1: '#8ACBD0', wave2: '#56B6C6',
    divider: 'rgba(23,12,121,0.08)',
  },

  {
    id: 9, name: 'wine + cream', mode: 'light',
    desc: 'warm peach-cream ground, deep maroon type, wine cta. rich and intimate — the warmest palette of the set.',
    swatches: ['#810B38','#F1E2D1','#DCC3AA','#541A1A'],
    bg: '#F1E2D1', surface: '#DCC3AA',
    text: '#541A1A', cta: '#810B38', ctaText: '#F1E2D1',
    accent: '#810B38', wave1: '#DCC3AA', wave2: '#810B38',
    divider: 'rgba(84,26,26,0.1)',
  },
  {
    id: 10, name: 'steel blue + cream', mode: 'light',
    desc: 'warm yellow-cream ground with cool steel blue accents. the contrast between warm bg and cool type is the palette\'s tension.',
    swatches: ['#647FBC','#91ADC8','#AED6CF','#FAFDD6'],
    bg: '#FAFDD6', surface: '#E4F0EE',
    text: '#1E2D5C', cta: '#647FBC', ctaText: '#FAFDD6',
    accent: '#AED6CF', wave1: '#91ADC8', wave2: '#647FBC',
    divider: 'rgba(100,127,188,0.1)',
  },
  {
    id: 11, name: 'mint + navy', mode: 'light',
    desc: 'very light mint ground, deep navy type and cta. the cleanest and most airy of the light modes. teal as the live signal.',
    swatches: ['#DCF2F1','#7FC7D9','#365486','#0F1035'],
    bg: '#DCF2F1', surface: '#C4E8E6',
    text: '#0F1035', cta: '#365486', ctaText: '#DCF2F1',
    accent: '#7FC7D9', wave1: '#7FC7D9', wave2: '#365486',
    divider: 'rgba(15,16,53,0.08)',
  },

  // ── DARK ───────────────────────────────────────────────────────────────────
  {
    id: 5, name: 'original · dark', mode: 'dark',
    desc: 'deep indigo ground, cream type. the palette inverts naturally — strongest dark mode of the set.',
    swatches: ['#0D0845','#170C79','#EFE3CA','#8ACBD0'],
    bg: '#0D0845', surface: '#170C79',
    text: '#EFE3CA', cta: '#EFE3CA', ctaText: '#170C79',
    accent: '#8ACBD0', wave1: '#8ACBD0', wave2: '#56B6C6',
    divider: 'rgba(239,227,202,0.07)',
  },
  {
    id: 6, name: 'sage + purple · dark', mode: 'dark',
    desc: 'deep aubergine ground, sage-cream type. the purple darkens into something meditative. sage waveform glows.',
    swatches: ['#16102A','#251A40','#E1EACD','#BAD8B6'],
    bg: '#16102A', surface: '#251A40',
    text: '#E1EACD', cta: '#BAD8B6', ctaText: '#16102A',
    accent: '#BAD8B6', wave1: '#BAD8B6', wave2: '#8D77AB',
    divider: 'rgba(225,234,205,0.07)',
  },
  {
    id: 7, name: 'mint + rose · dark', mode: 'dark',
    desc: 'dark forest ground, warm off-white type. rose cta feels warmer on the deep green than in light mode.',
    swatches: ['#0C1A14','#162B20','#F6F4E8','#DC9B9B'],
    bg: '#0C1A14', surface: '#162B20',
    text: '#F6F4E8', cta: '#DC9B9B', ctaText: '#F6F4E8',
    accent: '#C0E1D2', wave1: '#C0E1D2', wave2: '#DC9B9B',
    divider: 'rgba(246,244,232,0.07)',
  },
  {
    id: 8, name: 'yellow + coral · dark', mode: 'dark',
    desc: 'dark amber ground, warm cream type. coral pops harder here than anywhere. teal waveform is the most distinctive recording state.',
    swatches: ['#180E04','#2A1A08','#FFF6DE','#F48F68'],
    bg: '#180E04', surface: '#2A1A08',
    text: '#FFF6DE', cta: '#F48F68', ctaText: '#FFF6DE',
    accent: '#8BDFDD', wave1: '#8BDFDD', wave2: '#F48F68',
    divider: 'rgba(255,246,222,0.07)',
  },
  {
    id: 12, name: 'wine + cream · dark', mode: 'dark',
    desc: 'very deep wine ground, warm cream type. the record button glows like an ember. the richest dark mode of the set.',
    swatches: ['#1A0408','#2E0C18','#F1E2D1','#810B38'],
    bg: '#1A0408', surface: '#2E0C18',
    text: '#F1E2D1', cta: '#F1E2D1', ctaText: '#1A0408',
    accent: '#DCC3AA', wave1: '#DCC3AA', wave2: '#810B38',
    divider: 'rgba(241,226,209,0.07)',
  },
  {
    id: 13, name: 'steel blue + cream · dark', mode: 'dark',
    desc: 'deep navy ground, warm cream type. the blue and teal accents feel cooler and cleaner on dark than on light.',
    swatches: ['#0E1528','#1C2C4A','#FAFDD6','#AED6CF'],
    bg: '#0E1528', surface: '#1C2C4A',
    text: '#FAFDD6', cta: '#AED6CF', ctaText: '#0E1528',
    accent: '#647FBC', wave1: '#91ADC8', wave2: '#AED6CF',
    divider: 'rgba(250,253,214,0.07)',
  },
  {
    id: 14, name: 'mint + navy · dark', mode: 'dark',
    desc: 'darkest navy ground, mint text, teal as the live signal. the most stripped-back dark mode — minimal and precise.',
    swatches: ['#0F1035','#1C2050','#DCF2F1','#7FC7D9'],
    bg: '#0F1035', surface: '#1C2050',
    text: '#DCF2F1', cta: '#7FC7D9', ctaText: '#0F1035',
    accent: '#365486', wave1: '#DCF2F1', wave2: '#7FC7D9',
    divider: 'rgba(220,242,241,0.07)',
  },
];

// ─── RENDER ─────────────────────────────────────────────────────────────────

function micIcon(fg) {
  return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <rect x="9" y="2" width="6" height="13" rx="3" fill="${fg}"/>
    <path d="M5 11a7 7 0 0014 0" stroke="${fg}" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="${fg}" stroke-width="1.5" stroke-linecap="round"/>
  </svg>`;
}

function plusIcon(fg) {
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none">
    <line x1="12" y1="5" x2="12" y2="19" stroke="${fg}" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="19" y2="12" stroke="${fg}" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}

function waveform(w1, w2) {
  const bars = [w1, w1, w2, w2, w1, w1, w1];
  return `<div class="waveform">${bars.map(c => `<div class="w-bar" style="background:${c}"></div>`).join('')}</div>`;
}

function renderPhone(p, screen) {
  const shadow = p.mode === 'dark'
    ? '0 20px 56px rgba(0,0,0,0.7)'
    : '0 20px 56px rgba(0,0,0,0.4)';

  const inner = {
    capture: `
      <div class="phone-inner">
        <div class="status-bar" style="color:${p.text}"><span>9:41</span><span>●●●</span></div>
        <div class="s-title" style="color:${p.text}">capture</div>
        <div class="prompt" style="color:${p.text}">evening check-in.<br>anything worth<br>remembering?</div>
        <div class="record-area">
          <div class="record-btn" style="background:${p.cta}">${micIcon(p.ctaText)}</div>
          <div class="record-hint" style="color:${p.text}">tap to speak</div>
        </div>
        <div class="sub-action" style="color:${p.text}">or add manually</div>
      </div>`,

    review: `
      <div class="phone-inner">
        <div class="status-bar" style="color:${p.text}"><span>9:41</span><span>●●●</span></div>
        <div class="s-title" style="color:${p.text}">review</div>
        <div class="ex-header" style="color:${p.text}">here's what i got</div>
        <div class="ex-card" style="background:${p.surface}">
          <div class="f-name" style="color:${p.text}">rajesh patel</div>
          <div>
            <div class="c-dot" style="color:${p.text}">cotton manufacturer, rajkot</div>
            <div class="c-dot" style="color:${p.text}">wants to meet next week</div>
            <div class="c-dot" style="color:${p.text}">mentioned supply chain</div>
          </div>
          <div class="f-fu" style="color:${p.accent}">follow up · wednesday</div>
        </div>
        <button class="confirm-btn" style="background:${p.cta};color:${p.ctaText};margin-top:14px">looks right</button>
      </div>`,

    contacts: `
      <div class="phone-inner" style="position:relative">
        <div class="status-bar" style="color:${p.text}"><span>9:41</span><span>●●●</span></div>
        <div class="h-header" style="color:${p.text}">your people</div>
        ${[
          ['rajesh patel','follow up · tomorrow','today'],
          ['meera shah','last seen · 3 days ago',null],
          ['farid khan','follow up · friday','fri'],
          ['neha gupta','last seen · 1 week ago',null],
        ].map(([name, meta, badge]) => `
          <div class="c-row" style="border-bottom:1px solid ${p.divider}">
            <div>
              <div class="c-name" style="color:${p.text}">${name}</div>
              <div class="c-meta" style="color:${p.text}">${meta}</div>
            </div>
            ${badge ? `<div class="c-badge" style="color:${p.accent};background:${p.accent}18">${badge}</div>` : ''}
          </div>`).join('')}
        <div class="fab" style="background:${p.cta};box-shadow:0 4px 16px ${p.cta}44">
          ${plusIcon(p.ctaText)}
        </div>
      </div>`,

    recording: `
      <div class="phone-inner" style="align-items:center;justify-content:center;gap:0">
        <div class="status-bar" style="color:${p.text};position:absolute;top:24px;left:18px;right:18px;margin:0">
          <span>9:41</span><span>●●●</span>
        </div>
        <div style="font-size:10px;letter-spacing:0.1em;color:${p.text};opacity:0.28;margin-bottom:20px">listening</div>
        <div style="margin-bottom:20px">${waveform(p.wave1, p.wave2)}</div>
        <div class="record-btn" style="background:${p.cta};width:60px;height:60px">
          <div style="width:13px;height:13px;background:${p.ctaText};border-radius:0px"></div>
        </div>
        <div class="record-hint" style="color:${p.text};margin-top:11px">tap to stop</div>
      </div>`,
  };

  return `<div class="phone" style="background:${p.bg};box-shadow:${shadow}">${inner[screen]}</div>`;
}

function renderPalette(p, isLast) {
  const screens = [
    { key: 'capture',   label: 'capture' },
    { key: 'review',    label: 'extraction review' },
    { key: 'contacts',  label: 'contact list' },
    { key: 'recording', label: 'recording' },
  ];

  return `
    <div class="palette-section">
      <div class="palette-header">
        <div class="swatches">
          ${p.swatches.map(s => `<div class="swatch" style="background:${s}"></div>`).join('')}
        </div>
        <div class="palette-meta">
          <div class="palette-num">palette ${String(p.id).padStart(2,'0')}</div>
          <div class="palette-name">${p.name}</div>
          <div class="palette-desc">${p.desc}</div>
          <div class="mode-pill ${p.mode === 'light' ? 'light-pill' : 'dark-pill'}">${p.mode} mode</div>
        </div>
      </div>
      <div class="screens-row">
        ${screens.map(s => `
          <div class="screen-wrap">
            ${renderPhone(p, s.key)}
            <div class="screen-label">${s.label}</div>
          </div>`).join('')}
      </div>
    </div>
    ${!isLast ? '<div class="divider"></div>' : ''}
  `;
}

// Pairs: [lightId, darkId] — controls render order.
// When adding a new palette, add its pair here too.
const pairs = [
  [1,  6],  // sage + purple
  [2,  7],  // mint + rose
  [3,  8],  // yellow + coral
  [4,  5],  // original
  [9,  12], // wine + cream
  [10, 13], // steel blue + cream
  [11, 14], // mint + navy
];

function render() {
  const byId = Object.fromEntries(palettes.map(p => [p.id, p]));
  const root = document.getElementById('root');

  root.innerHTML = pairs.map(([ lightId, darkId ], i) => {
    const light = byId[lightId];
    const dark  = byId[darkId];
    const isLast = i === pairs.length - 1;
    return `
      ${renderPalette(light, false)}
      ${renderPalette(dark, isLast)}
      ${!isLast ? '<div class="divider"></div>' : ''}
    `;
  }).join('');
}

render();
</script>
</body>
</html>
